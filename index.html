<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>ペンちゃんカレンダー</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; background: #0f1218; color: #eef1f6; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: linear-gradient(135deg, #16202e, #1d2a3d); position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  header h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: .5px; }
  .nav { display: flex; align-items: center; gap: 6px; }
  .nav button { background: rgba(255,255,255,.08); color: #fff; border: none; border-radius: 10px; padding: 7px 12px; font-size: 14px; cursor: pointer; }
  .nav button:active { background: rgba(255,255,255,.2); }
  .dow { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; padding: 6px 0; background: #121722; color: #9aa6b8; }
  .dow div:first-child { color: #ff7b7b; }
  .dow div:last-child { color: #6bc5ff; }
  .grid { display: flex; flex-direction: column; gap: 1px; background: #1b2130; transition: opacity .15s; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; position: relative; }
  .span-bar { position: absolute; height: 15px; line-height: 15px; font-size: 9px; color: #fff; padding: 0 4px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; z-index: 2; }
  .span-bar.cont-l { border-top-left-radius: 0; border-bottom-left-radius: 0; }
  .span-bar.cont-r { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .span-bar.yuki { background: #1e88e5; }
  .span-bar.miki { background: #e91e63; }
  .span-bar.both { background: #8e24aa; }
  .span-bar.bday { background: linear-gradient(90deg, #ff4081, #ffb300); font-weight: 700; }
  .span-bar.pending { opacity: .6; }
  .grid.slide-next { animation: slideNext .22s ease-out; }
  .grid.slide-prev { animation: slidePrev .22s ease-out; }
  @keyframes slideNext { from { transform: translateX(28px); opacity: .35; } to { transform: none; opacity: 1; } }
  @keyframes slidePrev { from { transform: translateX(-28px); opacity: .35; } to { transform: none; opacity: 1; } }
  .grid.loading { opacity: .55; }
  .cell { min-height: 78px; background: #0f1218; padding: 3px 2px; cursor: pointer; overflow: hidden; position: relative; }
  .cell.other { opacity: 0.35; }
  .cell.selected { background: #1c2740; box-shadow: inset 0 0 0 1.5px #4f8cff; }
  .cell.dragging { background: #2c2148 !important; box-shadow: inset 0 0 0 2px #e91e63 !important; }
  .day-num { font-size: 12px; text-align: center; width: 22px; height: 22px; line-height: 22px; margin: 0 auto 2px; border-radius: 50%; }
  .cell.sun .day-num, .cell.hol .day-num { color: #ff7b7b; }
  .cell.sat .day-num { color: #6bc5ff; }
  .cell.today .day-num { background: #2979ff; color: #fff; font-weight: 800; }
  .ev-pill { color: #fff; font-size: 9px; line-height: 1.15; padding: 1px 3px; border-radius: 4px; margin-bottom: 2px; word-break: break-all; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ev-pill.yuki { background: #1e88e5; }
  .ev-pill.miki { background: #e91e63; }
  .ev-pill.both { background: #8e24aa; }
  .ev-pill.holiday { background: #479683; }
  .ev-pill.penguin { background: #64748b; color: #fff; }
  .ev-pill.bday { background: linear-gradient(90deg, #ff4081, #ffb300); font-weight: 700; }
  .ev-pill.pending { opacity: .6; }
  .more { font-size: 9px; color: #9aa6b8; text-align: center; }
  .tips { margin: 0 12px 24px; padding: 10px 12px; border-radius: 12px; background: linear-gradient(135deg, #12304a, #173a5a); font-size: 12px; line-height: 1.5; color: #d6ecff; display: flex; gap: 8px; align-items: flex-start; }
  .tips b { color: #fff; }
  .panel { padding: 14px; min-height: 200px; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .panel-title { font-size: 15px; font-weight: 700; }
  .add-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #3b82f6, #1e88e5); color: #fff; border: none; border-radius: 50%; font-size: 22px; line-height: 1; font-weight: 500; cursor: pointer; box-shadow: 0 2px 8px rgba(30,136,229,.35); }
  .ev-item { display: flex; justify-content: space-between; align-items: center; background: #1a2030; padding: 10px 12px; border-radius: 12px; margin-bottom: 8px; border-left: 4px solid #e91e63; }
  .ev-item.editable { cursor: pointer; }
  .ev-item.editable:active { background: #232b40; }
  .ev-time { font-size: 12px; color: #9aa6b8; }
  .ev-name { font-size: 14px; font-weight: 600; margin-top: 2px; word-break: break-all; }
  .ev-actions { display: flex; gap: 6px; flex-shrink: 0; margin-left: 8px; }
  .del-btn { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; background: rgba(255,107,107,.12); color: #ff7b7b; border: 1px solid rgba(255,107,107,.35); border-radius: 10px; cursor: pointer; transition: background .15s; }
  .del-btn:active { background: rgba(255,107,107,.28); }
  .confirm-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.68); z-index: 60; align-items: center; justify-content: center; padding: 20px; }
  .confirm-bg.open { display: flex; }
  .confirm-box { background: #171c28; width: 100%; max-width: 320px; border-radius: 16px; padding: 20px 18px 16px; border: 1px solid #2b3345; box-shadow: 0 12px 32px rgba(0,0,0,.5); animation: up .16s ease-out; }
  .confirm-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  .confirm-msg { font-size: 13px; color: #c4cddc; line-height: 1.5; margin-bottom: 16px; word-break: break-all; }
  .confirm-actions { display: flex; gap: 8px; }
  .confirm-actions button { flex: 1; padding: 10px; border-radius: 10px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; }
  .btn-del { background: #e53935; color: #fff; }
  .empty { color: #77819a; font-size: 13px; text-align: center; padding: 20px 0; }
  .waddle { display: inline-block; animation: waddle .6s ease-in-out infinite alternate; }
  @keyframes waddle { from { transform: rotate(-12deg); } to { transform: rotate(12deg); } }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #333c4f; color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 13px; z-index: 100; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .confetti { position: fixed; top: -12px; width: 8px; height: 12px; border-radius: 2px; z-index: 99; pointer-events: none; animation: fall 2.6s linear forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(540deg); opacity: 0; } }
  .owner-btns { display: flex; gap: 6px; margin-bottom: 10px; }
  .owner-btn { flex: 1; padding: 9px 4px; border-radius: 10px; border: 2px solid #2b3345; background: #121722; color: #ccc; font-size: 13px; font-weight: 700; cursor: pointer; text-align: center; }
  .owner-btn.active.yuki { border-color: #1e88e5; background: #1e88e5; color: #fff; }
  .owner-btn.active.miki { border-color: #e91e63; background: #e91e63; color: #fff; }
  .owner-btn.active.both { border-color: #8e24aa; background: #8e24aa; color: #fff; }
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 50; align-items: flex-end; justify-content: center; }
  .modal-bg.open { display: flex; }
  .modal { background: #171c28; width: 100%; max-width: 480px; border-radius: 18px 18px 0 0; padding: 18px; animation: up .18s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal h2 { margin: 0 0 12px; font-size: 16px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; color: #9aa6b8; margin-bottom: 4px; }
  .field input[type="text"], .field input[type="date"], .field input[type="time"] { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #2b3345; background: #0f1218; color: #fff; font-size: 15px; }
  .mini-opt { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; color: #9aa6b8; }
  .mini-opt label { display: flex; align-items: center; gap: 4px; cursor: pointer; margin: 0; }
  .mini-opt select { padding: 4px 8px; border-radius: 6px; border: 1px solid #2b3345; background: #0f1218; color: #eef1f6; font-size: 12px; }
  .row { display: flex; gap: 8px; }
  .row .field { flex: 1; }
  .modal-actions { display: flex; gap: 8px; margin-top: 14px; }
  .modal-actions button { flex: 1; padding: 12px; border-radius: 12px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; }
  .btn-cancel { background: #2b3345; color: #fff; }
  .btn-save { background: #1e88e5; color: #fff; }
</style>
</head>
<body>
<header>
  <h1 id="monthLabel">🐧 ペンちゃん</h1>
  <div class="nav">
    <button onclick="moveMonth(-1)">◀</button>
    <button onclick="goToday()">今日</button>
    <button onclick="moveMonth(1)">▶</button>
  </div>
</header>
<div class="dow"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
<div class="grid" id="grid"></div>
<div class="panel">
  <div class="panel-head">
    <div class="panel-title" id="selectedLabel"></div>
    <button class="add-btn" onclick="openModal()" aria-label="予定を追加">＋</button>
  </div>
  <div id="eventList"><div class="empty"><span class="waddle">🐧</span> 読み込み中ペン…</div></div>
</div>
<div class="toast" id="toast"></div>
<div class="confirm-bg" id="confirmBg" onclick="if(event.target===this)closeConfirm()">
  <div class="confirm-box">
    <div class="confirm-title">🐧 削除の確認</div>
    <div class="confirm-msg" id="confirmMsg"></div>
    <div class="confirm-actions">
      <button class="btn-cancel" onclick="closeConfirm()">キャンセル</button>
      <button class="btn-del" id="confirmOk">削除する</button>
    </div>
  </div>
</div>
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2 id="modalTitle">🐧 予定を追加</h2>
    <div class="owner-btns">
      <div class="owner-btn active both" id="ob-both" onclick="setOwner('both')">ふたり</div>
      <div class="owner-btn yuki" id="ob-yuki" onclick="setOwner('yuki')">ゆうき</div>
      <div class="owner-btn miki" id="ob-miki" onclick="setOwner('miki')">みき</div>
    </div>
    <div class="field"><label>タイトル</label><input type="text" id="fTitle" placeholder="例：ご飯、旅行、〇〇誕生日🎂"></div>
    <div class="row">
      <div class="field"><label>開始日</label><input type="date" id="fDate" onchange="syncEndDate()"></div>
      <div class="field"><label>終了日</label><input type="date" id="fEndDate"></div>
    </div>
    <div class="field"><label><input type="checkbox" id="fAllDay" onchange="toggleTime()"> 終日</label></div>
    <div class="row" id="timeRow">
      <div class="field"><label>開始</label><input type="time" id="fStart" value="12:00"></div>
      <div class="field"><label>終了</label><input type="time" id="fEnd" value="13:00"></div>
    </div>
    <div class="mini-opt">
      <label><input type="checkbox" id="fRemOn" checked onchange="toggleMiniOpts()"> リマインダー</label>
      <select id="fRemMin">
        <option value="10">10分前</option>
        <option value="30">30分前</option>
        <option value="60" selected>1時間前</option>
        <option value="120">2時間前</option>
        <option value="1440">1日前</option>
      </select>
    </div>
    <div class="mini-opt">
      <label><input type="checkbox" id="fRecOn" onchange="toggleMiniOpts()"> 繰り返し</label>
      <select id="fRecur" style="display:none">
        <option value="daily">毎日</option>
        <option value="weekly">毎週</option>
        <option value="monthly">毎月</option>
        <option value="yearly">毎年</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
      <button class="btn-save" onclick="saveEvent()">保存する</button>
    </div>
  </div>
</div>
<script>
  const GAS_API = 'https://script.google.com/macros/s/AKfycby_keYHDFZc5bHmRn0VB8ebnKBFnFjGTQhJAjJqneu5gOBIxleB55Edw_poVyM0fr-7/exec';
  const API_KEY = new URLSearchParams(location.search).get('k') || '';
  if (typeof google === 'undefined') {
    window.google = { script: { run: (() => {
      function makeRunner(ok, ng) {
        return {
          withSuccessHandler: fn => makeRunner(fn, ng),
          withFailureHandler: fn => makeRunner(ok, fn),
          getMonthEvents: (y, m) => fetch(GAS_API + '?api=month&k=' + encodeURIComponent(API_KEY) + '&y=' + y + '&m=' + m).then(r => r.json()).then(d => { if (d && d.error) throw new Error(d.error); if (ok) ok(d); }).catch(e => { if (ng) ng(e); }),
          getRangeEvents: (sy, sm, ey, em) => fetch(GAS_API + '?api=range&k=' + encodeURIComponent(API_KEY) + '&sy=' + sy + '&sm=' + sm + '&ey=' + ey + '&em=' + em).then(r => r.json()).then(d => { if (d && d.error) throw new Error(d.error); if (ok) ok(d); }).catch(e => { if (ng) ng(e); }),
          saveWebEvent: (eventId, dateStr, endDateStr, startTime, endTime, allDay, title, owner, remMin, recur) => fetch(GAS_API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ api: 'save', k: API_KEY, eventId, dateStr, endDateStr, startTime, endTime, allDay, title, owner, remMin, recur }) }).then(r => r.json()).then(d => { if (d && d.error) throw new Error(d.error); if (ok) ok(d); }).catch(e => { if (ng) ng(e); }),
          deleteWebEvent: (eventId) => fetch(GAS_API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ api: 'delete', k: API_KEY, eventId }) }).then(r => r.json()).then(d => { if (d && d.error) throw new Error(d.error); if (ok) ok(d); }).catch(e => { if (ng) ng(e); })
        };
      }
      return makeRunner(null, null);
    })() } };
  }

  const today = new Date();
  let curYear = today.getFullYear();
  let curMonth = today.getMonth() + 1;
  let selectedDate = fmtDate(today);
  let selectedOwner = 'both';
  let editingId = '';
  let monthCache = {};
  let prefetched = false;
  let lastTapDate = '', lastTapTime = 0;

  const TIPS = [
    'ペンギンの膝は、体の中に隠れているペン。',
    'コウテイペンギンのお父さんは、卵を足の上で約2か月温めるペン。',
    'いちばん小さいのはコガタペンギン。身長30cmちょっとペン。',
    'いちばん大きいのはコウテイペンギン。身長1m以上あるペン。',
    'コウテイペンギンは500m以上の深さまで潜れるペン。',
    'ペンギンの目の上にある「塩類腺」は海水の塩分をろ過し、くちばしから高濃度の塩水として排出するペン。',
    'ジェンツーペンギンは時速30km以上で泳げるペン。',
    '背中が黒くお腹が白いのは、海の上からも下からも見つかりにくい迷彩ペン。',
    'アデリーペンギンは、小石をプレゼントして巣作りするペン。',
    'コウテイペンギンは、みんなでぎゅっと集まる「ハドル」で寒さをしのぐペン。',
    'ペンギンは年に1回、羽が一気に生え変わるペン。その間は泳げないペン。',
    'ペンギンの仲間は18種類くらいいるペン。',
    'ケープペンギンは、ロバみたいな声で鳴くペン。',
    'ペンギンの翼（フリッパー）は肘と手首の関節がほぼ固定され、水中揚力を最大化する水中翼構造ペン。',
    'イワトビペンギンは、名前のとおり岩をぴょんぴょん跳ぶペン。',
    'キングペンギンのヒナは茶色のもふもふで、親より大きく見えることがあるペン。',
    'ペンギンは、同じパートナーと何年もペアを続けることが多いペン。',
    'ほぼ全部のペンギンは南半球に住んでいるペン。ガラパゴスペンギンだけ赤道を少し越えるペン。',
    '日本はペンギンを飼っている数が世界でもトップクラスの国ペン。',
    'ペンギンの羽は短くてびっしり。1枚1枚が防水コートみたいになってるペン。',
    'ペンギンは水中で目がよく見えるように、レンズの形を変えられるペン。',
    'ペンギンのしっぽは意外と硬くて、立っているときの支えにもなるペン。',
    'ヒゲペンギンは、あごの下に黒い線があって本当にヒゲみたいに見えるペン。',
    'マゼランペンギンは地面に穴を掘って巣を作るペン。',
    'ペンギンは寝るとき、立ったまま寝ることもお腹をつけて寝ることもあるペン。',
    'コウテイペンギンのヒナは、親の声を聞き分けて迷子にならないペン。',
    'ペンギンは氷の上をすべるとき、お腹でそりみたいに滑る「トボガン」をするペン。',
    'ペンギンは魚を丸のみするとき、のどのトゲトゲで逃げられないようにしてるペン。',
    'アデリーペンギンは意外と気が強くて、アザラシにも立ち向かうことがあるペン。',
    'ペンギンの足は動脈と静脈が密着した「対向流熱交換」構造で、体熱を逃がさず凍傷を防ぐペン。',
    'ペンギンは英語で Penguin。昔は北半球のオオウミガラスをそう呼んでいたペン。',
    'ペンギンは漢字で「人鳥」と書くペン。立っている姿が人みたいだからペン。',
    'コウテイペンギンはマイナス40度の極寒でも平気で過ごせるペン。',
    'コウテイペンギンの体重は30〜40kgくらいあるペン。小学生くらいペン。',
    'ペンギンの体温は約38〜39度。人間よりちょっと高いペン。',
    'コウテイペンギンの筋肉には酸素を蓄えるミオグロビンが人間の約10倍あり、長時間の潜水に耐えるペン。',
    'ペンギンの骨は空を飛ぶ鳥と違って中がぎっしり詰まってるペン。潜りやすくするためペン。',
    'ペンギンは海から氷の上へ飛び上がるとき、2m近くジャンプできるペン。',
    'ペンギンは陸を歩くとき、体を左右に揺らしてエネルギーを節約してるペン。',
    'ペンギンの翼は「フリッパー」と呼ばれていて、ヒレみたいに硬くて強いペン。',
    'ペンギンは実は首がけっこう長いペン。普段は縮めているだけペン。',
    'ペンギンのひざは常に曲がった状態なので、ずっと空気椅子してるみたいな姿勢ペン。',
    'ペンギンには歯がないペン。その代わり舌と口の中にトゲがあるペン。',
    'ペンギンは味覚があまり発達していなくて、甘味やうま味を感じにくいらしいペン。',
    'ペンギンは水中を泳ぐとき、泡を羽の間から出して水の抵抗を減らしているペン。',
    'フンボルトペンギンは、日本の動物園や水族館でいちばん多く見られる種類ペン。',
    'フンボルトペンギンは南米の暖かい海に住んでいるから、日本の夏もけっこう平気ペン。',
    'ガラパゴスペンギンは暑さ対策で、翼を広げて日陰を作ったりハアハア息をするペン。',
    'キングペンギンは、卵を温めてヒナを育てるのに1年以上かかるペン。',
    'キングペンギンのヒナは昔、大人と見た目が違いすぎて別の種類だと思われていたペン。',
    'ジェンツーペンギンは頭の白いバンド模様がチャームポイントペン。',
    'ジェンツーペンギンは「ペンギン界の最速スイマー」と呼ばれてるペン。',
    'マカロニペンギンは頭の黄色い飾り羽が名前の由来ペン。昔のオシャレな人のあだ名から来てるペン。',

  function tipHtml(ds) {
    const p = (ds || fmtDate(today)).split('-').map(Number);
    const d = new Date(p[0], p[1] - 1, p[2]);
    const doy = Math.floor((d - new Date(p[0], 0, 0)) / 86400000);
    return '<div class="tips" style="margin:8px 0 0"><span style="font-size:18px">🐧</span><div><b>きょうのペンギン豆知識</b><br>' + TIPS[doy % TIPS.length] + '</div></div>';
  }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
  }
  function setOwner(o) {
    selectedOwner = o;
    ['both','yuki','miki'].forEach(k => document.getElementById('ob-' + k).classList.toggle('active', k === o));
  }
  function ymKey(y, m){ return y + '-' + m; }
  function isBday(t){ return /誕生|生誕|バースデー|birthday|🎂/i.test(t || ''); }
  function isUserBday(e){ return e && e.kind === 'event' && isBday(e.title) && !/天皇/.test(e.title || ''); }
  function launchConfetti(){
    const colors = ['#ff4081','#ffd740','#40c4ff','#69f0ae','#e040fb'];
    for(let i=0;i<24;i++){
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (Math.random()*100) + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.animationDelay = (Math.random()*0.6) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 3300);
    }
  }
  function pad(n){ return String(n).padStart(2,'0'); }
  function fmtDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function rank(e){ return e.kind==='holiday' ? 0 : (e.kind==='penguin' ? 1 : (e.allDay ? 2 : 3)); }
  function dayEvents(ds){
    const p = ds.split('-');
    return (monthCache[ymKey(Number(p[0]), Number(p[1]))] || []).filter(e => e.date === ds)
      .sort((a,b) => rank(a)-rank(b) || (a.startTime||'').localeCompare(b.startTime||''));
  }
  function snapshot(){ return JSON.parse(JSON.stringify(monthCache)); }

  const seasonIcons = ['','🎍','❄️','🎎','🌸','🎏','☔','🌻','🎆','🌕','🎃','🍁','🎄'];
  function loadMonth(force) {
    document.getElementById('monthLabel').textContent = '🐧 ' + curYear + '年' + curMonth + '月 ' + (seasonIcons[curMonth] || '');
    const key = ymKey(curYear, curMonth);
    renderGrid();
    if (!force && monthCache[key]) { renderDayEvents(); return; }
    document.getElementById('grid').classList.add('loading');
    google.script.run.withSuccessHandler(evs => {
      monthCache[key] = evs || [];
      document.getElementById('grid').classList.remove('loading');
      renderGrid(); renderDayEvents();
      if (!prefetched) { prefetched = true; prefetchYear(); }
    }).withFailureHandler(() => {
      document.getElementById('grid').classList.remove('loading');
      toast('読み込めなかったペン。もう一回開いてほしいペン。');
    }).getMonthEvents(curYear, curMonth);
  }

  function prefetchYear() {
    const s = new Date(curYear, curMonth - 4, 1);
    const e = new Date(curYear, curMonth + 11, 1);
    google.script.run.withSuccessHandler(allEvs => {
      const grouped = {};
      (allEvs || []).forEach(ev => {
        const p = ev.date.split('-');
        const k = ymKey(Number(p[0]), Number(p[1]));
        (grouped[k] = grouped[k] || []).push(ev);
      });
      let d = new Date(s.getFullYear(), s.getMonth(), 1);
      while (d <= e) {
        const k = ymKey(d.getFullYear(), d.getMonth() + 1);
        monthCache[k] = grouped[k] || [];
        d.setMonth(d.getMonth() + 1);
      }
      renderGrid(); renderDayEvents();
    }).getRangeEvents(s.getFullYear(), s.getMonth() + 1, e.getFullYear(), e.getMonth() + 1);
  }
  function refresh(){ prefetched = true; prefetchYear(); }

  // 横スワイプで月切替 ＋ 長押しドラッグで複数日範囲選択
  let touchStartX = 0, touchStartY = 0;
  let dragTimer = null, isDragging = false, dragStart = '', dragEnd = '', keepRange = null;
  const gridEl = document.getElementById('grid');

  function updateDragHighlight() {
    const a = isDragging ? (dragStart <= dragEnd ? dragStart : dragEnd) : (keepRange ? keepRange[0] : '');
    const b = isDragging ? (dragStart <= dragEnd ? dragEnd : dragStart) : (keepRange ? keepRange[1] : '');
    const on = !!(a && b);
    gridEl.querySelectorAll('.cell').forEach(c => {
      const ds = c.dataset.date;
      c.classList.toggle('dragging', on && ds >= a && ds <= b);
    });
  }
  function cellDateAt(x, y) {
    const el = document.elementFromPoint(x, y);
    const cell = el ? el.closest('.cell') : null;
    return cell ? cell.dataset.date : '';
  }
  function startLongPress(x, y) {
    const ds = cellDateAt(x, y);
    if (!ds) return;
    touchStartX = x; touchStartY = y;
    clearTimeout(dragTimer);
    dragTimer = setTimeout(() => {
      isDragging = true;
      dragStart = ds; dragEnd = ds;
      if (navigator.vibrate) navigator.vibrate(25);
      updateDragHighlight();
    }, 650);
  }
  function moveLongPress(x, y, ev) {
    if (!isDragging) {
      if (Math.hypot(x - touchStartX, y - touchStartY) > 8) clearTimeout(dragTimer);
      return;
    }
    if (ev && ev.cancelable) ev.preventDefault();
    const ds = cellDateAt(x, y);
    if (ds && ds !== dragEnd) { dragEnd = ds; updateDragHighlight(); }
  }
  function endLongPress(x, y, allowSwipe) {
    clearTimeout(dragTimer);
    if (isDragging) {
      const a = dragStart <= dragEnd ? dragStart : dragEnd;
      const b = dragStart <= dragEnd ? dragEnd : dragStart;
      isDragging = false; dragStart = ''; dragEnd = '';
      keepRange = (a !== b) ? [a, b] : null;
      selectedDate = a;
      renderGrid(); renderDayEvents();
      updateDragHighlight();
      if (a !== b) openModalRange(a, b);
      return;
    }
    if (allowSwipe) {
      const dx = x - touchStartX, dy = y - touchStartY;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) moveMonth(dx < 0 ? 1 : -1);
    }
  }

  gridEl.addEventListener('touchstart', e => {
    const t = e.changedTouches[0];
    startLongPress(t.clientX, t.clientY);
  }, { passive: true });
  gridEl.addEventListener('touchmove', e => {
    const t = e.changedTouches[0];
    moveLongPress(t.clientX, t.clientY, e);
  }, { passive: false });
  gridEl.addEventListener('touchend', e => {
    const t = e.changedTouches[0];
    endLongPress(t.clientX, t.clientY, true);
  }, { passive: true });
  gridEl.addEventListener('touchcancel', () => { clearTimeout(dragTimer); isDragging = false; updateDragHighlight(); });

  // PCマウスでも長押しドラッグ対応
  gridEl.addEventListener('mousedown', e => { if (e.button === 0) startLongPress(e.clientX, e.clientY); });
  window.addEventListener('mousemove', e => { if (dragTimer || isDragging) moveLongPress(e.clientX, e.clientY, e); });
  window.addEventListener('mouseup', e => { if (isDragging) endLongPress(e.clientX, e.clientY, false); else clearTimeout(dragTimer); });

  function renderGrid() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    const first = new Date(curYear, curMonth - 1, 1);
    const startDate = new Date(curYear, curMonth - 1, 1 - first.getDay());
    const todayStr = fmtDate(today);

    for (let w = 0; w < 6; w++) {
      const weekEl = document.createElement('div');
      weekEl.className = 'week';
      const wDates = [];
      for (let c = 0; c < 7; c++) {
        const d = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate() + w * 7 + c);
        wDates.push({ d: d, ds: fmtDate(d) });
      }
      const wStart = wDates[0].ds, wEnd = wDates[6].ds;

      // この週にまたがる複数日予定を1本ずつ集約して段(lane)を割り当て
      const spanMap = {};
      wDates.forEach(({ ds }) => {
        dayEvents(ds).forEach(e => {
          if (e.kind === 'event' && e.startDate && e.endDate && e.startDate !== e.endDate && !spanMap[e.id]) {
            spanMap[e.id] = e;
          }
        });
      });
      const spans = Object.values(spanMap).map(e => {
        const c1 = Math.max(0, wDates.findIndex(x => x.ds === e.startDate));
        const idx2 = wDates.findIndex(x => x.ds === e.endDate);
        const c2 = idx2 === -1 ? 6 : idx2;
        return { e: e, c1: e.startDate < wStart ? 0 : c1, c2: e.endDate > wEnd ? 6 : c2, contL: e.startDate < wStart, contR: e.endDate > wEnd };
      }).sort((a, b) => a.c1 - b.c1 || (b.c2 - b.c1) - (a.c2 - a.c1));

      const lanes = [];
      const maxLanesPerCol = [0,0,0,0,0,0,0];
      spans.forEach(sp => {
        let lane = 0;
        while (lanes[lane] && lanes[lane].some(x => !(sp.c2 < x.c1 || sp.c1 > x.c2))) lane++;
        (lanes[lane] = lanes[lane] || []).push(sp);
        sp.lane = lane;
        for (let k = sp.c1; k <= sp.c2; k++) maxLanesPerCol[k] = Math.max(maxLanesPerCol[k], lane + 1);
      });

      // 7日分のセルを描画（複数日予定以外の通常予定を下に配置）
      wDates.forEach(({ d, ds }, colIdx) => {
        const cell = document.createElement('div');
        cell.dataset.date = ds;
        const cellEvs = dayEvents(ds);
        const singleEvs = cellEvs.filter(e => !(e.kind === 'event' && e.startDate && e.endDate && e.startDate !== e.endDate));
        const isHol = cellEvs.some(e => e.kind === 'holiday');
        const isP = cellEvs.some(e => e.kind === 'penguin');
        cell.className = 'cell' + (d.getMonth()+1 !== curMonth ? ' other' : '') + (d.getDay()===0?' sun':'') + (d.getDay()===6?' sat':'') + (isHol?' hol':'') + (isP?' pday':'') + (ds===todayStr?' today':'') + (ds===selectedDate?' selected':'');
        cell.onclick = () => {
          const nowTap = Date.now();
          const isDbl = (lastTapDate === ds && nowTap - lastTapTime < 350);
          lastTapDate = ds; lastTapTime = nowTap;
          selectedDate = ds;
          renderGrid(); renderDayEvents();
          if (cellEvs.some(e => isUserBday(e))) launchConfetti();
          if (isDbl) openModal();
          else document.querySelector('.panel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        };
        const num = document.createElement('div');
        num.className = 'day-num';
        num.textContent = d.getDate();
        cell.appendChild(num);

        // 複数日バー分の高さを確保
        if (maxLanesPerCol[colIdx] > 0) {
          const spacer = document.createElement('div');
          spacer.style.height = (maxLanesPerCol[colIdx] * 17) + 'px';
          cell.appendChild(spacer);
        }

        const maxSingle = Math.max(1, 3 - maxLanesPerCol[colIdx]);
        singleEvs.slice(0, maxSingle).forEach(e => {
          const p = document.createElement('div');
          const cls = isUserBday(e) ? ' bday' : (e.kind==='holiday' ? ' holiday' : (e.kind==='penguin' ? ' penguin' : (' ' + (e.owner || 'both'))));
          p.className = 'ev-pill' + cls + (String(e.id).indexOf('tmp_') === 0 ? ' pending' : '');
          p.textContent = (isUserBday(e) && e.title.indexOf('🎂') < 0 ? '🎂' : '') + e.title;
          cell.appendChild(p);
        });
        if (singleEvs.length > maxSingle) {
          const m = document.createElement('div');
          m.className = 'more';
          m.textContent = '+' + (singleEvs.length - maxSingle);
          cell.appendChild(m);
        }
        weekEl.appendChild(cell);
      });

      // 繋がった複数日バーを重ねて描画
      spans.forEach(sp => {
        const e = sp.e;
        const bar = document.createElement('div');
        const cls = isUserBday(e) ? ' bday' : (' ' + (e.owner || 'both'));
        bar.className = 'span-bar' + cls + (sp.contL ? ' cont-l' : '') + (sp.contR ? ' cont-r' : '') + (String(e.id).indexOf('tmp_') === 0 ? ' pending' : '');
        bar.style.top = (27 + sp.lane * 17) + 'px';
        bar.style.left = 'calc(' + (sp.c1 * 100 / 7) + '% + ' + (sp.contL ? 0 : 2) + 'px)';
        bar.style.width = 'calc(' + ((sp.c2 - sp.c1 + 1) * 100 / 7) + '% - ' + ((sp.contL ? 0 : 2) + (sp.contR ? 0 : 2)) + 'px)';
        bar.textContent = (isUserBday(e) && e.title.indexOf('🎂') < 0 ? '🎂' : '') + e.title;
        weekEl.appendChild(bar);
      });

      grid.appendChild(weekEl);
    }
  }

  function renderDayEvents() {
    const parts = selectedDate.split('-');
    const w = ['日','月','火','水','木','金','土'][new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2])).getDay()];
    document.getElementById('selectedLabel').textContent = Number(parts[1]) + '月' + Number(parts[2]) + '日（' + w + '）の予定';
    const list = document.getElementById('eventList');
    const evs = dayEvents(selectedDate);
    if (!evs.length) { list.innerHTML = '<div class="empty">予定はないペン。</div>' + tipHtml(selectedDate); return; }
    list.innerHTML = '';
    evs.forEach(e => {
      const div = document.createElement('div');
      div.className = 'ev-item';
      const ownerLabel = e.owner === 'yuki' ? 'ゆうき' : (e.owner === 'miki' ? 'みき' : 'ふたり');
      div.style.borderLeftColor = isUserBday(e) ? '#ffb300' : (e.kind === 'holiday' ? '#479683' : (e.kind === 'penguin' ? '#64748b' : (e.owner === 'yuki' ? '#1e88e5' : (e.owner === 'miki' ? '#e91e63' : '#8e24aa'))));
      const isMulti = e.startDate && e.endDate && e.startDate !== e.endDate;
      const sd = isMulti ? e.startDate.slice(5).replace('-','/') : '';
      const ed = isMulti ? e.endDate.slice(5).replace('-','/') : '';
      const timeStr = isMulti ? (e.allDay ? sd + '〜' + ed + ' 終日' : sd + ' ' + e.startTime + ' 〜 ' + ed + ' ' + e.endTime) : (e.allDay ? '終日' : e.startTime + ' 〜 ' + e.endTime);
      const subText = e.kind==='holiday' ? '日本の祝日' : (e.kind==='penguin' ? 'ペンギンにまつわる日' : ('[' + ownerLabel + '] ' + timeStr));
      div.innerHTML = '<div><div class="ev-time">' + subText + '</div><div class="ev-name">' + esc(e.title) + '</div></div>';
      if (e.id && String(e.id).indexOf('tmp_') !== 0) {
        div.classList.add('editable');
        div.onclick = () => openEditModal(e);
        const acts = document.createElement('div');
        acts.className = 'ev-actions';
        const btn = document.createElement('button');
        btn.className = 'del-btn'; btn.title = '削除';
        btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';
        btn.onclick = (ev) => {
          ev.stopPropagation();
          openConfirm('「' + e.title + '」を削除するペン？', () => {
            const backup = snapshot();
            Object.keys(monthCache).forEach(k => { monthCache[k] = monthCache[k].filter(x => x.id !== e.id); });
            renderGrid(); renderDayEvents();
            google.script.run
              .withSuccessHandler(() => { toast('削除したペン。'); refresh(); })
              .withFailureHandler(() => { monthCache = backup; renderGrid(); renderDayEvents(); toast('削除できなかったペン。もう一回お願いペン。'); })
              .deleteWebEvent(e.id);
          });
        };
        acts.appendChild(btn);
        div.appendChild(acts);
      }
      list.appendChild(div);
    });
  }

  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function moveMonth(diff){
    curMonth += diff; if(curMonth<1){curMonth=12;curYear--;} if(curMonth>12){curMonth=1;curYear++;}
    gridEl.classList.remove('slide-next','slide-prev');
    void gridEl.offsetWidth;
    gridEl.classList.add(diff > 0 ? 'slide-next' : 'slide-prev');
    loadMonth();
  }
  function goToday(){ curYear = today.getFullYear(); curMonth = today.getMonth()+1; selectedDate = fmtDate(today); loadMonth(); }
  function syncEndDate(){ const s = document.getElementById('fDate').value; const e = document.getElementById('fEndDate'); if (!e.value || e.value < s) e.value = s; }
  function fillModal(title, d1, d2, allDay, st, et, owner, heading, remMin, recur){
    document.getElementById('modalTitle').textContent = heading;
    document.getElementById('fTitle').value = title;
    document.getElementById('fDate').value = d1;
    document.getElementById('fEndDate').value = d2;
    document.getElementById('fAllDay').checked = allDay;
    document.getElementById('fStart').value = st;
    document.getElementById('fEnd').value = et;
    const rm = (remMin === undefined || remMin === null) ? 60 : Number(remMin);
    document.getElementById('fRemOn').checked = rm > 0;
    document.getElementById('fRemMin').value = String(rm > 0 ? rm : 60);
    document.getElementById('fRecOn').checked = !!recur;
    document.getElementById('fRecur').value = recur || 'weekly';
    toggleTime(); toggleMiniOpts(); setOwner(owner);
    document.getElementById('modalBg').classList.add('open');
  }
  function openModal(){ editingId = ''; fillModal('', selectedDate, selectedDate, false, '12:00', '13:00', 'both', '🐧 予定を追加', 60, ''); }
  function openModalRange(d1, d2){ editingId = ''; fillModal('', d1, d2, d1 !== d2, '12:00', '13:00', 'both', '🐧 予定を追加', 60, ''); }
  function openEditModal(e){ editingId = e.id; fillModal(e.title, e.startDate || e.date, e.endDate || e.date, !!e.allDay, e.startTime || '12:00', e.endTime || '13:00', e.owner || 'both', '🐧 予定を編集', e.remMin, e.recur); }
  function closeModal(){ document.getElementById('modalBg').classList.remove('open'); keepRange = null; updateDragHighlight(); }
  function toggleMiniOpts(){
    document.getElementById('fRemMin').style.display = document.getElementById('fRemOn').checked ? '' : 'none';
    document.getElementById('fRecur').style.display = document.getElementById('fRecOn').checked ? '' : 'none';
  }
  let confirmCb = null;
  function openConfirm(msg, cb){
    document.getElementById('confirmMsg').textContent = msg;
    confirmCb = cb;
    document.getElementById('confirmBg').classList.add('open');
  }
  function closeConfirm(){ document.getElementById('confirmBg').classList.remove('open'); confirmCb = null; }
  document.getElementById('confirmOk').onclick = () => { const cb = confirmCb; closeConfirm(); if (cb) cb(); };
  function toggleTime(){ document.getElementById('timeRow').style.display = document.getElementById('fAllDay').checked ? 'none' : 'flex'; }

  function saveEvent(){
    const title = document.getElementById('fTitle').value.trim();
    const dateStr = document.getElementById('fDate').value;
    let endDateStr = document.getElementById('fEndDate').value || dateStr;
    if (endDateStr < dateStr) endDateStr = dateStr;
    if (!title || !dateStr) { toast('タイトルと日付を入れてほしいペン。'); return; }
    const allDay = document.getElementById('fAllDay').checked;
    const startTime = document.getElementById('fStart').value;
    const endTime = document.getElementById('fEnd').value;
    const targetEditId = editingId;
    const owner = selectedOwner;
    const remMin = document.getElementById('fRemOn').checked ? Number(document.getElementById('fRemMin').value) : 0;
    const recur = document.getElementById('fRecOn').checked ? document.getElementById('fRecur').value : '';
    const backup = snapshot();

    // 楽観的UI：0秒で反映
    if (targetEditId) Object.keys(monthCache).forEach(k => { monthCache[k] = monthCache[k].filter(x => x.id !== targetEditId); });
    const tmpId = 'tmp_' + Date.now();
    const sp = dateStr.split('-').map(Number);
    const ep = endDateStr.split('-').map(Number);
    let cur = new Date(sp[0], sp[1] - 1, sp[2]);
    const lim = new Date(ep[0], ep[1] - 1, ep[2]);
    let g = 0;
    while (cur <= lim && g < 31) {
      const k = ymKey(cur.getFullYear(), cur.getMonth() + 1);
      (monthCache[k] = monthCache[k] || []).push({
        id: tmpId, kind: 'event', owner: owner, title: title, allDay: allDay,
        date: fmtDate(cur), startDate: dateStr, endDate: endDateStr,
        startTime: allDay ? '' : startTime, endTime: allDay ? '' : endTime
      });
      cur.setDate(cur.getDate() + 1); g++;
    }
    closeModal(); renderGrid(); renderDayEvents();
    if (isBday(title)) launchConfetti();

    google.script.run
      .withSuccessHandler(() => { toast('保存したペン。'); refresh(); })
      .withFailureHandler(() => { monthCache = backup; renderGrid(); renderDayEvents(); toast('保存できなかったペン。もう一回お願いペン。'); })
      .saveWebEvent(targetEditId, dateStr, endDateStr, startTime, endTime, allDay, title, owner, remMin, recur);
  }
  loadMonth();
</script>
</body>
</html>
